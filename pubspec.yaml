name: netease_music
description: 网易云音乐 Flutter 客户端（基于 NeteaseCloudMusicApi）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  dio: ^5.9.0
  just_audio: ^0.10.5
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  dynamic_color: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  min_sdk_android: 21
