name: Build releases

# 打包发布：推送 v* 标签或手动触发
# 产物：Android APK(分架构/自签)、iOS IPA(未签名)、macOS DMG、
#       Linux deb/rpm/AppImage/pacman、Windows zip
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  # ---------------- Android ----------------
  android:
    name: Android APK (multi-arch, self-signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Analyze
        run: flutter analyze

      - name: Prepare self-signed keystore
        # 想要固定签名以便覆盖安装升级：把 keystore 以 base64 存到
        # Secrets.ANDROID_KEYSTORE_BASE64，并设置 ANDROID_KEYSTORE_PASSWORD /
        # ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS；否则每次 CI 临时生成
        # （临时生成的 keystore 每次都不同，无法覆盖安装升级）。
        # 固定自签变量：alias=cmsplayer，store/key 密码=134679。
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            STORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          else
            keytool -genkeypair -keystore android/app/release.keystore \
              -alias cmsplayer -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass 134679 -keypass 134679 \
              -dname "CN=cmsplayer, OU=Music, O=cmsplayer, L=Unknown, ST=Unknown, C=CN"
            STORE_PASS=134679
            KEY_PASS=134679
            KEY_ALIAS=cmsplayer
          fi
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

  # ---------------- iOS ----------------
  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build ipa --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

  # ---------------- macOS ----------------
  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Create DMG
        run: |
          brew install create-dmg
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" -print -quit)
          echo "App: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH" .app)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; else VERSION="dev"; fi
          mkdir -p dist
          create-dmg \
            --volname "云音乐" \
            --window-pos 200 120 \
            --window-size 640 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 175 120 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 475 120 \
            "dist/netease-music-${VERSION}-macos.dmg" \
            "$APP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  # ---------------- Linux ----------------
  linux:
    name: Linux packages (deb/rpm/AppImage/pacman)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev rpm

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Install nfpm
        run: |
          TAG=$(curl -sfL https://api.github.com/repos/goreleaser/nfpm/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          echo "nfpm $TAG"
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/${TAG}/nfpm_${TAG#v}_amd64.deb" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build deb / rpm / pacman
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; else VERSION="0.0.0-dev"; fi
          echo "VERSION=$VERSION" | tee -a "$GITHUB_ENV"
          VERSION="$VERSION" nfpm package --config packaging/linux/nfpm.yaml --packager deb --target dist/
          VERSION="$VERSION" nfpm package --config packaging/linux/nfpm.yaml --packager rpm --target dist/
          VERSION="$VERSION" nfpm package --config packaging/linux/nfpm.yaml --packager archlinux --target dist/

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          curl -sfL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cp packaging/linux/netease-music.desktop AppDir/usr/share/applications/
          cp packaging/linux/icon.png AppDir/usr/share/icons/hicolor/512x512/apps/netease-music.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/netease_music" "$@"
          EOF
          chmod +x AppDir/AppRun
          ln -sf usr/share/applications/netease-music.desktop AppDir/netease-music.desktop
          ln -sf usr/share/icons/hicolor/512x512/apps/netease-music.png AppDir/netease-music.png
          /tmp/appimagetool AppDir "dist/netease-music-${VERSION}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  # ---------------- Windows ----------------
  windows:
    name: Windows ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $version = $Matches[1] } else { $version = 'dev' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\netease-music-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip

  # ---------------- Release ----------------
  release:
    name: Publish GitHub Release
    needs: [android, ios, macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
